version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=scholarquest_secret
      - DB_NAME=grantglide_db
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: scholarquest_secret
      MYSQL_DATABASE: grantglide_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./flask_backend/database.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
